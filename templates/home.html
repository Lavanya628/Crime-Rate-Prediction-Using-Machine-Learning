<!DOCTYPE html>
<html>
<head>
    <title>Crime Rate Prediction</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 100vh;
            background:
                linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
                url("https://img.freepik.com/premium-photo/word-made-wooden-letters-is-crime-metal-handcuffs-gray-breaking-law_102583-749.jpg");
            background-size: cover;
            background-position: center;
            color: white;
        }

        /* -------- TOP BAR -------- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(0,0,0,0.6);
        }

        .top-bar h3 {
            margin: 0;
            font-weight: normal;
        }

        /* -------- CENTER CONTENT -------- */
        .content {
            height: calc(100vh - 70px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .content h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .content h1 span {
            color: #f1c27d;
        }

        .content p {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ddd;
        }

        /* -------- BUTTONS -------- */
        .nav-buttons a {
            display: inline-block;
            padding: 12px 25px;
            margin: 0 10px;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            transition: 0.3s;
        }

        .nav-buttons a:hover {
            background-color: #084298;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <h3>🔐 Crime Rate Prediction System</h3>
    <h3>👋 Welcome {{ user }}</h3>
</div>

<!-- MAIN CONTENT -->
<div class="content">
    <h1>
        WELCOME TO <span>CRIME RATE PREDICTION</span>
    </h1>

    <p>
        Analyze crime patterns and predict outcomes using Machine Learning
    </p>

    <div class="nav-buttons">
        
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('predict') }}">Predict</a>
        <a href="{{ url_for('logout') }}">Logout</a>
    </div>
</div>

</body>
</html>
